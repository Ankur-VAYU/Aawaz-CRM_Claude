<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NITA Alumni Patna</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: app shell. Sidebar nav on wide screens, bottom tab bar on phones; one content column of cards and lists. */
/* Layout: app shell. Navy sidebar on wide screens, bottom tab bar on phones; one content column of cards and lists.
   Identity: a university-seal feel. Deep navy and antique gold, a serif for headings, a clean sans for reading. */
:root {
  --bg: #f4f6fb;
  --surface: #ffffff;
  --sunk: #edf0f7;
  --ink: #0f1a3a;
  --muted: #5a6483;
  --line: #dde2ee;
  --accent: #1b2e6b;
  --accent-ink: #ffffff;
  --accent-soft: #e6eaf6;
  --gold: #c9a04a;
  --gold-text: #8f6516;
  --gold-soft: #f7f0e1;
  --gold-line: #e6d3a8;
  --event: #8a5f12;
  --event-soft: #f7f0e1;
  --ok: #2e7a3c;
  --ok-soft: #e0f0e2;
  --warn: #8a5800;
  --warn-soft: #fbefcf;
  --bad: #b3261e;
  --bad-soft: #f9dfdc;
  --info: #3550a8;
  --info-soft: #e3e8f8;
  --scrim: rgb(9 15 35 / 0.55);
  --shadow: 0 1px 2px rgb(15 26 58 / 0.04), 0 10px 28px -16px rgb(15 26 58 / 0.18);
  --side-bg: #0f1a3a;
  --side-ink: #eef0f8;
  --side-muted: #a3adcb;
  --side-hover: rgb(255 255 255 / 0.06);
  --side-active: rgb(201 160 74 / 0.14);
  --hero-bg: #13245a;
  --hero-ink: #f3f1ea;
  --emb-navy: #13245a;
  --emb-gold: #c9a04a;
  --display: "Fraunces", Georgia, "Times New Roman", serif;
  --body: "Figtree", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --radius: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0b1126; --surface: #121b36; --sunk: #0e1630; --ink: #e9ecf6; --muted: #9ba5c5; --line: #25304f;
    --accent: #d4af5a; --accent-ink: #111a33; --accent-soft: #2a2616; --gold-text: #dcbb6c; --gold-soft: #2a2414; --gold-line: #5a4a24;
    --event: #e2be6e; --event-soft: #2a2414;
    --ok: #7cc786; --ok-soft: #1a3522; --warn: #e6b450; --warn-soft: #3a2d0e; --bad: #f08a82; --bad-soft: #43201d;
    --info: #a9bcf5; --info-soft: #1c2748; --scrim: rgb(0 0 0 / 0.65); --shadow: 0 1px 0 rgb(0 0 0 / 0.25);
    --side-bg: #070c1c; --hero-bg: #0f1d4a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0b1126; --surface: #121b36; --sunk: #0e1630; --ink: #e9ecf6; --muted: #9ba5c5; --line: #25304f;
  --accent: #d4af5a; --accent-ink: #111a33; --accent-soft: #2a2616; --gold-text: #dcbb6c; --gold-soft: #2a2414; --gold-line: #5a4a24;
  --event: #e2be6e; --event-soft: #2a2414;
  --ok: #7cc786; --ok-soft: #1a3522; --warn: #e6b450; --warn-soft: #3a2d0e; --bad: #f08a82; --bad-soft: #43201d;
  --info: #a9bcf5; --info-soft: #1c2748; --scrim: rgb(0 0 0 / 0.65); --shadow: 0 1px 0 rgb(0 0 0 / 0.25);
  --side-bg: #070c1c; --hero-bg: #0f1d4a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--body); -webkit-font-smoothing: antialiased; }
h1, h2, h3 { font-family: var(--display); line-height: 1.15; text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h1 { font-size: 2rem; font-weight: 600; }
h2 { font-size: 1.25rem; font-weight: 600; }
h3 { font-family: var(--body); font-size: 1rem; font-weight: 600; letter-spacing: 0; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }

.shell { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: 100%; }
.side { position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; padding: 28px 16px 24px; display: flex; flex-direction: column; gap: 28px; background: var(--side-bg); color: var(--side-ink); }
.side .brand { padding: 0 6px 22px; border-bottom: 1px solid rgb(201 160 74 / 0.25); }
.side .brand b { color: var(--side-ink); }
.brand { display: flex; gap: 10px; align-items: center; min-width: 0; }
.emblem { width: 44px; height: 44px; flex: none; display: block; }
.emblem svg { width: 100%; height: 100%; display: block; }
.brand b { font: 600 1.15rem/1.1 var(--display); display: block; letter-spacing: -0.01em; }
.brand small { color: var(--gold); font-size: 0.68rem; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; }
.emb-navy { fill: var(--emb-navy); }
.emb-gold { fill: var(--emb-gold); }
.emb-ring { fill: none; stroke: var(--emb-gold); }
.emb-line { fill: none; stroke: var(--emb-navy); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav button { all: unset; cursor: pointer; display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 8px; color: var(--side-muted); font-weight: 500; }
.nav button:hover { background: var(--side-hover); color: var(--side-ink); }
.nav button[aria-current="page"] { background: var(--side-active); color: var(--side-ink); box-shadow: inset 2px 0 0 var(--gold); font-weight: 600; }
.nav button[aria-current="page"] svg { color: var(--gold); }
.nav button:focus-visible { outline: 2px solid var(--gold); }
.nav svg, .tabbar svg, .iconbtn svg { width: 20px; height: 20px; flex: none; }
.count { margin-left: auto; background: var(--bad); color: var(--surface); font-size: 0.72rem; font-weight: 700; border-radius: 99px; padding: 0 7px; line-height: 1.5; }
.side-foot { margin-top: auto; display: grid; gap: 6px; font-size: 0.82rem; color: var(--side-muted); padding: 0 6px; }
.side-foot .linkbtn { color: var(--gold); }

main { padding: 20px 32px 48px; min-width: 0; max-width: 1000px; display: flex; flex-direction: column; gap: 24px; }
.utilbar { display: flex; align-items: center; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
.utilbar .brand { display: none; margin-right: auto; }
.demo-as { display: flex; align-items: center; gap: 8px; font-size: 0.8rem; color: var(--warn); background: var(--warn-soft); padding: 4px 4px 4px 10px; border-radius: 8px; }
.demo-as select { width: auto; padding: 4px 8px; font-size: 0.85rem; border-color: transparent; }
.iconbtn { all: unset; cursor: pointer; position: relative; width: 38px; height: 38px; display: grid; place-items: center; border-radius: 50%; background: var(--surface); border: 1px solid var(--line); color: var(--ink); }
.iconbtn:focus-visible { outline: 2px solid var(--accent); }
.iconbtn .count { position: absolute; top: -4px; right: -6px; }
.top { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.top h1::after { content: ""; display: block; width: 44px; height: 2px; background: var(--gold); margin: 12px 0 10px; }
.top > div { min-width: 0; }
.top p { color: var(--muted); max-width: 62ch; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; box-shadow: var(--shadow); }
.section { display: flex; flex-direction: column; gap: 12px; }
.section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.eyebrow { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold-text); }
.linkbtn { all: unset; cursor: pointer; color: var(--accent); font-weight: 600; font-size: 0.9rem; }
.linkbtn:focus-visible { outline: 2px solid var(--accent); }
.muted { color: var(--muted); font-size: 0.88rem; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

.btn { border: 1px solid transparent; background: var(--accent); color: var(--accent-ink); font-weight: 600; letter-spacing: 0.01em; padding: 10px 18px; border-radius: 8px; transition: filter 0.15s, background 0.15s; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover:not(:disabled) { filter: brightness(1.08); }
.btn.ghost { background: var(--surface); border-color: var(--line); color: var(--ink); }
.btn.danger { background: transparent; border-color: var(--bad); color: var(--bad); }
.btn.small { padding: 5px 10px; font-size: 0.85rem; }
.btn.on { background: var(--accent-soft); color: var(--accent); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }

.tag { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; padding: 2px 8px; border-radius: 99px; background: var(--sunk); color: var(--muted); align-self: start; white-space: nowrap; }
.tag.job { background: var(--accent-soft); color: var(--accent); }
.tag.referral { background: var(--info-soft); color: var(--info); }
.tag.help { background: var(--event-soft); color: var(--event); }
.tag.offer, .tag.ok { background: var(--ok-soft); color: var(--ok); }
.tag.mentor { background: var(--info-soft); color: var(--info); }
.tag.warn { background: var(--warn-soft); color: var(--warn); }
.tag.bad { background: var(--bad-soft); color: var(--bad); }

/* Home */
.hero-guest { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 24px; align-items: center; color: var(--hero-ink); border: 1px solid rgb(201 160 74 / 0.35); padding: 36px; position: relative; overflow: hidden;
  background: radial-gradient(120% 140% at 100% 0%, rgb(201 160 74 / 0.18), transparent 55%), repeating-linear-gradient(135deg, rgb(255 255 255 / 0.025) 0 2px, transparent 2px 14px), var(--hero-bg); }
.hero-guest .hero-copy { display: grid; gap: 16px; min-width: 0; }
.hero-guest h1 { font-size: 2.4rem; font-weight: 600; }
.hero-guest h1 em { font-style: italic; color: var(--emb-gold); font-weight: 500; }
.hero-guest p { max-width: 54ch; opacity: 0.9; font-size: 1.05rem; }
.hero-guest .eyebrow { color: var(--emb-gold); }
.hero-guest .btn { background: var(--emb-gold); color: #13245a; }
.hero-guest .btn.ghost { background: transparent; color: var(--hero-ink); border-color: rgb(243 241 234 / 0.5); }
.hero-seal { width: 168px; height: 168px; }
.steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; counter-reset: s; }
.step { display: grid; gap: 4px; }
.step::before { counter-increment: s; content: counter(s); width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--gold); color: var(--gold-text); display: grid; place-items: center; font: 600 1rem var(--display); }
.hero-event { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 20px; align-items: center; background: linear-gradient(135deg, var(--gold-soft), var(--surface)); border-color: var(--gold-line); }
.datebox { width: 74px; text-align: center; background: var(--surface); border-radius: 8px; padding: 8px 0; border: 1px solid var(--line); }
.datebox b { display: block; font: 600 1.9rem/1 var(--display); color: var(--gold-text); }
.datebox span { font-size: 0.75rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
.grid2.dir-top { grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); align-items: start; }
.list { display: flex; flex-direction: column; }
.list > * + * { border-top: 1px solid var(--line); }
.item { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; padding: 12px 0; }
.item:first-child { padding-top: 0; }
.item:last-child { padding-bottom: 0; }
.item small { color: var(--muted); font-size: 0.85rem; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.stat b { display: block; font: 600 1.8rem/1.1 var(--display); font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: 0.85rem; }
.banner { display: flex; gap: 12px; align-items: center; padding: 12px 16px; border-radius: var(--radius); flex-wrap: wrap; }
.banner.ok { background: var(--ok-soft); color: var(--ok); }
.banner.warn { background: var(--warn-soft); color: var(--warn); }
.banner.bad { background: var(--bad-soft); color: var(--bad); }
.banner.info { background: var(--info-soft); color: var(--info); }
.banner span { flex: 1 1 240px; }
.meter { height: 8px; background: var(--sunk); border-radius: 99px; overflow: hidden; }
.meter i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--gold)); border-radius: 99px; }
.pin { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.12em; color: var(--gold-text); }

/* Events */
.event { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 16px; align-items: start; }
.event.past { opacity: 0.72; }
.event-actions { display: flex; flex-direction: column; gap: 8px; align-items: stretch; min-width: 150px; }
.cap { display: grid; gap: 4px; font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }

/* Directory */
.filters { display: grid; grid-template-columns: minmax(0, 2fr) repeat(4, minmax(0, 1fr)); gap: 10px; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label, .field .lbl { font-size: 0.8rem; font-weight: 600; color: var(--muted); }
input, select, textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; min-width: 0; }
input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); flex: none; }
textarea { min-height: 96px; resize: vertical; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 0.92rem; }
.people { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 12px; }
.person { display: flex; flex-direction: column; gap: 10px; }
.person-head { display: flex; gap: 12px; align-items: center; min-width: 0; }
.person-head > div { min-width: 0; }
.avatar { width: 52px; height: 52px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font: 600 1.05rem var(--display); box-shadow: 0 0 0 2px var(--surface), 0 0 0 3px var(--gold-line); flex: none; overflow: hidden; }
.avatar.sm { width: 36px; height: 36px; font-size: 0.8rem; }
.avatar.lg { width: 96px; height: 96px; font-size: 1.6rem; }
.avatar img { width: 100%; height: 100%; object-fit: cover; }
.batch { font: 500 0.78rem var(--mono); color: var(--muted); }
.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 3px 12px; font-size: 0.9rem; margin: 0; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.phone { font-variant-numeric: tabular-nums; user-select: all; }
.empty { text-align: center; color: var(--muted); padding: 32px 16px; }
.bars { display: grid; gap: 6px; }
.bar { all: unset; cursor: pointer; display: grid; grid-template-columns: 130px minmax(0, 1fr) 28px; gap: 10px; align-items: center; font-size: 0.88rem; border-radius: 6px; padding: 2px 4px; }
.bar:hover { background: var(--sunk); }
.bar:focus-visible { outline: 2px solid var(--accent); }
.bar[aria-pressed="true"] { background: var(--accent-soft); }
.bar span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar i { display: block; height: 10px; border-radius: 99px; background: linear-gradient(90deg, var(--accent), var(--gold)); }
.bar b { text-align: right; font-variant-numeric: tabular-nums; }

/* Chips and tabs */
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { all: unset; cursor: pointer; padding: 5px 12px; border-radius: 99px; border: 1px solid var(--line); font-size: 0.88rem; font-weight: 600; color: var(--muted); background: var(--surface); }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.chip:focus-visible { outline: 2px solid var(--accent); }
.chip .count { margin-left: 6px; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { all: unset; cursor: pointer; padding: 8px 12px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; display: flex; align-items: center; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--gold); }
.tabs button:focus-visible { outline: 2px solid var(--accent); }

/* Board */
.board-bar { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
.post { display: flex; flex-direction: column; gap: 10px; }
.post.closed { opacity: 0.7; }
.post-head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.post .where { color: var(--muted); font-size: 0.85rem; }
.post p { max-width: 70ch; }
.post-foot { display: flex; gap: 10px; justify-content: space-between; align-items: center; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 10px; }

/* Forms */
.form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.form .full { grid-column: 1 / -1; }
.form-actions { grid-column: 1 / -1; display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
fieldset { border: 0; padding: 0; margin: 0; display: contents; }
legend { grid-column: 1 / -1; font: 700 0.75rem var(--body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); padding-top: 8px; }
.photo-row { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.hint { font-size: 0.82rem; color: var(--muted); }
.rules { background: var(--sunk); border-radius: 8px; padding: 10px 14px; font-size: 0.85rem; color: var(--muted); }
.rules ul { margin: 4px 0 0; padding-left: 18px; }

/* Admin */
.review { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 16px 0; }
.review:first-child { padding-top: 0; }
.review:last-child { padding-bottom: 0; }
.review-side { display: flex; flex-direction: column; gap: 8px; min-width: 230px; }
.checklist { display: grid; gap: 6px; font-size: 0.88rem; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.log { font-size: 0.88rem; }
.tbl { width: 100%; border-collapse: collapse; font-size: 0.9rem; font-variant-numeric: tabular-nums; }
.tbl th, .tbl td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl th { font-size: 0.75rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); background: var(--sunk); white-space: nowrap; }
.tbl tr:last-child td { border-bottom: 0; }
.code { font: 500 0.8rem/1.5 var(--mono); background: var(--sunk); padding: 10px 12px; border-radius: 8px; overflow-x: auto; margin: 0; white-space: pre; }
.title-sel { width: auto; padding: 4px 8px; font-size: 0.85rem; }
input[type="radio"] { width: 18px; height: 18px; accent-color: var(--accent); flex: none; margin: 2px 0 0; }
.log time { font: 500 0.78rem var(--mono); color: var(--muted); white-space: nowrap; }

/* Notifications */
.notif { all: unset; cursor: pointer; display: grid; grid-template-columns: 10px minmax(0, 1fr); gap: 10px; padding: 10px 0; }
.notif:focus-visible { outline: 2px solid var(--accent); }
.notif .dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 8px; background: transparent; }
.notif.unread .dot { background: var(--accent); }
.notif.unread b { font-weight: 700; }
.notif b { font-weight: 400; }

.modal-back { position: fixed; inset: 0; background: var(--scrim); display: grid; place-items: center; padding: 16px; z-index: 20; }
.modal { width: min(600px, 100%); max-height: calc(100vh - 32px); overflow: auto; display: flex; flex-direction: column; gap: 12px; }
.modal-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.otp-demo { font: 500 0.9rem var(--mono); background: var(--warn-soft); color: var(--warn); padding: 6px 10px; border-radius: 6px; }

.toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-weight: 600; z-index: 30; max-width: calc(100% - 32px); }
.tabbar { display: none; }

@media (max-width: 900px) {
  .filters { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .filters .field:first-child { grid-column: 1 / -1; }
  .grid2, .grid2.dir-top { grid-template-columns: minmax(0, 1fr); }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 720px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side { display: none; }
  main { padding: 12px 16px calc(96px + env(safe-area-inset-bottom, 0px)); gap: 20px; }
  .utilbar .brand { display: flex; }
  .utilbar .brand small { display: none; }
  .utilbar .emblem { width: 38px; height: 38px; }
  h1 { font-size: 1.45rem; }

  const handlers = {
    go: (v) => { if (v === "signin") { openLogin(); return; } ui.view = v; closeModal(); render(); window.scrollTo(0, 0); },
    open: (k) => ({ post: openPost, event: openEvent, register: () => openRegister(""), signin: openLogin, notifs: openNotifs, announce: openAnnounce, update: openUpdate, delete: openDelete })[k](),
  };

  document.addEventListener("click", (ev) => {
    const t = ev.target.closest("button, [data-backdrop]");
    if (!t) return;
    if (t.hasAttribute("data-backdrop")) { if (ev.target === t) closeModal(); return; }
    const d = t.dataset;
    if (d.go) return handlers.go(d.go);
    if (d.open) return handlers.open(d.open);
    if ("close" in d) return closeModal();
    if (t.id === "resetBtn") { S = JSON.parse(JSON.stringify(SEED)); save(); ui.view = "home"; render(); return toast("Sample data restored"); }
    if (d.rsvp) return openRsvp(d.rsvp);
    if (d.pay) return openPay(d.pay);
    if (d.paynow) { const e = S.events.find((x) => x.id === d.paynow), r = myRsvp(e); r.paid = Number(r.paid || 0) + balance(e, r); r.pay = "online"; r.ref = "pay_demo_" + Math.random().toString(36).slice(2, 6).toUpperCase(); save(); closeModal(); render(); return toast("Payment received. Reference " + r.ref); }
    if (d.payvenue) { const e = S.events.find((x) => x.id === d.payvenue), r = myRsvp(e); r.pay = "venue"; save(); closeModal(); render(); return toast("Noted. Pay " + money(balance(e, r)) + " at the venue"); }
    if (d.cash) { const [eid, u] = d.cash.split(":"), e = S.events.find((x) => x.id === eid), r = e.rsvps.find((x) => x.uid === u); const amt = balance(e, r); r.paid = Number(r.paid || 0) + amt; r.pay = "venue"; log("Recorded " + money(amt) + " paid at the venue by " + (byId(u) || {}).name + " for “" + e.title + "”"); save(); render(); return toast("Marked as paid at the venue"); }
    if (d.unrsvp) { const e = S.events.find((x) => x.id === d.unrsvp), r = myRsvp(e); if (r && r.paid > 0 && r.pay === "online") notify("staff", cur().name + " cancelled their RSVP for “" + e.title + "” after paying " + money(r.paid) + " online. Refund needed.", "admin"); e.rsvps = e.rsvps.filter((x) => x.uid !== S.session); save(); closeModal(); render(); return toast("RSVP cancelled"); }
    if (d.attendees) return openAttendees(d.attendees);
    if (d.person) return openPerson(d.person);
    if (d.copy) {
      const v = d.copy;
      const fallback = () => { const el = t.closest(".modal").querySelector(".phone"); if (el) { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } toast("Number selected. Copy it with your keyboard or long-press"); };
      try { navigator.clipboard.writeText(v).then(() => toast("Number copied"), fallback); } catch (e) { fallback(); }
      return;
    }
    if ("clear" in d) { Object.keys(filters).forEach((k) => (filters[k] = k === "mentor" ? false : "")); return render(); }
    if (d.quick) { const c = cur(), val = { batch: String(c.batch), homeDistrict: c.homeDistrict, workDistrict: c.workDistrict, mentor: true }[d.quick]; filters[d.quick] = filters[d.quick] === val ? (d.quick === "mentor" ? false : "") : val; return render(); }
    if (d.district) { const k = ui.dirChart === "home" ? "homeDistrict" : "workDistrict"; filters[k] = filters[k] === d.district ? "" : d.district; return render(); }
    if (d.chart) { ui.dirChart = d.chart; return render(); }
    if (d.type) { ui.boardType = d.type; return render(); }
    if (d.interest) { const p = S.posts.find((x) => x.id === d.interest), i = p.interested.indexOf(S.session); if (i >= 0) p.interested.splice(i, 1); else { p.interested.push(S.session); notify(p.by, cur().name + " is interested in your post “" + p.title + "”.", "board"); } save(); render(); return toast(i >= 0 ? "Removed your interest" : "The author has been notified"); }
    if (d.interestedList) return openInterested(d.interestedList);
    if (d.status) { const p = S.posts.find((x) => x.id === d.post); p.status = d.status; if (d.status === "open") p.expires = addDays(TODAY, 30); save(); render(); return toast({ filled: "Marked as filled", closed: "Post closed", open: "Post reopened for 30 days" }[d.status]); }
    if (d.report) return openReport(d.report);
    if (d.hide) { const p = S.posts.find((x) => x.id === d.hide); p.status = "hidden"; S.reports.forEach((r) => { if (r.post === p.id && r.status === "open") r.status = "actioned"; }); notify(p.by, "Your post “" + p.title + "” was removed by a moderator for breaking the posting rules.", "board"); log("Removed post “" + p.title + "”"); save(); render(); return toast("Post removed"); }
    if (d.dismiss) { const r = S.reports.find((x) => x.id === d.dismiss); S.reports.forEach((x) => { if (x.post === r.post && x.status === "open") x.status = "dismissed"; }); log("Dismissed report on “" + (S.posts.find((p) => p.id === r.post) || {}).title + "”"); save(); render(); return toast("Report dismissed"); }
    if (d.atab) { ui.adminTab = d.atab; return render(); }
    if (d.approve) { const a = byId(d.approve), m = batchMatch(a); a.status = "verified"; delete a.infoAsked; notify(a.id, "Your profile was verified. Welcome to the Patna chapter.", "alumni"); log("Approved " + a.name + " (" + a.roll + ")" + (m.level === "full" ? " · batch list match" : m.level === "partial" ? " · partial batch list match, checked manually" : " · not in batch list, checked proof")); save(); render(); return toast(a.name + " approved and listed in the directory"); }
    if (d.reject) return openReject(d.reject);
    if (d.askinfo) return openAskInfo(d.askinfo);
    if (d.role && d.uid) { const a = byId(d.uid); a.role = d.role; if (d.role === "member") a.title = ""; notify(a.id, d.role === "member" ? "Your chapter role was changed to member." : "You are now a chapter " + d.role + ".", "profile"); log((d.role === "member" ? "Removed staff role from " : "Made " ) + a.name + (d.role === "member" ? "" : " a " + d.role)); save(); render(); return toast("Role updated"); }
    if (d.suspend) { const a = byId(d.suspend); a.status = "suspended"; log("Suspended " + a.name); save(); render(); return toast(a.name + " suspended"); }
    if (d.reinstate) { const a = byId(d.reinstate); a.status = "verified"; log("Reinstated " + a.name); save(); render(); return toast(a.name + " reinstated"); }
    if (d.pinann) { const n = S.announcements.find((x) => x.id === d.pinann); n.pinned = !n.pinned; save(); return render(); }
    if (d.delann) { const n = S.announcements.find((x) => x.id === d.delann); S.announcements = S.announcements.filter((x) => x !== n); log("Deleted announcement “" + n.title + "”"); save(); render(); return toast("Announcement deleted"); }
    if (d.delupd) { const u = S.updates.find((x) => x.id === d.delupd); S.updates = S.updates.filter((x) => x !== u); log("Deleted NIT Agartala update “" + u.title + "”"); save(); render(); return toast("Update deleted"); }
    if ("nudge" in d) { const stale = verifiedUsers().filter((a) => daysBetween(a.updated, TODAY) > 365); stale.forEach((a) => notify(a.id, "Please check your profile is up to date: position, organisation and districts.", "profile")); log("Sent profile update reminder to " + stale.length + " members"); save(); render(); return toast("Reminder sent to " + stale.length + " members"); }
    if (d.notif) { const n = S.notifications.find((x) => x.id === d.notif); n.read = true; save(); closeModal(); ui.view = n.go || "home"; return render(); }
    if ("readall" in d) { myNotifs().forEach((n) => (n.read = true)); save(); openNotifs(); return render(); }
    if ("signout" in d) { setSession(null); ui.view = "home"; render(); return toast("Signed out"); }
    if ("confirmdelete" in d) { const c = cur(); c.status = "suspended"; c.deleteRequested = TODAY; notify("staff", c.name + " asked for their account to be deleted.", "admin"); log("Account deletion requested by " + c.name); setSession(null); closeModal(); ui.view = "home"; render(); return toast("Deletion requested. You have been signed out"); }
    if ("resubmit" in d) { const f = $("#profileForm"); if (f) { f.scrollIntoView({ behavior: "smooth" }); toast("Correct your details below, then save to submit again"); } return; }
  });

  document.addEventListener("keydown", (ev) => { if (ev.key === "Escape" && $("#modalRoot").firstChild) closeModal(); });

  document.addEventListener("input", (ev) => {
    const t = ev.target;
    if (!("live" in t.dataset)) return;
    if (t.id === "f-q") filters.q = t.value; else if (t.id === "m-q") ui.memberQ = t.value; else if (t.id === "bl-q") ui.batchQ = t.value;
    const pos = t.selectionStart, id = t.id; render();
    const el = document.getElementById(id); if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch (e) {} }
  });
  document.addEventListener("change", (ev) => {
    const t = ev.target;
    if (t.id === "demoAs") { if (t.value !== "custom") { setSession(DEMO_AS[t.value]); if (t.value === "admin") ui.view = "admin"; else if (ui.view === "admin") ui.view = "home"; closeModal(); render(); toast("Now viewing as " + t.options[t.selectedIndex].text.toLowerCase()); } return; }
    if (t.dataset.filter && t.dataset.filter !== "q") { filters[t.dataset.filter] = t.value; return render(); }
    if (t.id === "b-state") { ui.boardState = t.value; return render(); }
    if (t.id === "b-closed") { ui.showClosed = t.checked; return render(); }
    if (t.id === "b-mine") { ui.mineOnly = t.checked; return render(); }
    if (t.dataset.check) { const [id, k] = t.dataset.check.split(":"); checks[id] = checks[id] || {}; checks[id][k] = t.checked; return render(); }
    if (t.dataset.title) { const a = byId(t.dataset.title); a.title = t.value; log("Set committee title of " + a.name + " to " + (t.value || "none")); save(); render(); return toast("Title updated"); }
    if (t.id === "bl-file" && t.files[0]) {
      const reader = new FileReader();
      reader.onload = () => {
        const lines = String(reader.result).split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
        const head = (lines.shift() || "").toLowerCase().split(",").map((h) => h.trim());
        const idx = (k) => head.indexOf(k);
        if (["roll", "name", "batch", "branch", "degree"].some((k) => idx(k) < 0)) return toast("The first row must be: roll,name,batch,branch,degree");
        let added = 0, updated = 0, skipped = 0;
        lines.forEach((l) => {
          const c = l.split(",").map((x) => x.trim().replace(/^"|"$/g, ""));
          const rec = { roll: (c[idx("roll")] || "").toUpperCase(), name: c[idx("name")] || "", batch: Number(c[idx("batch")]), branch: c[idx("branch")] || "", degree: c[idx("degree")] || "" };
          if (!rec.roll || !rec.name || !rec.batch) { skipped++; return; }
          const ex = S.batchList.rows.find((r) => r.roll === rec.roll);
          if (ex) { Object.assign(ex, rec); updated++; } else { S.batchList.rows.push(rec); added++; }
        });
        S.batchList.uploaded = TODAY; S.batchList.by = S.session;
        log("Uploaded batch list: " + added + " added, " + updated + " updated, " + skipped + " skipped");
        save(); render(); toast(added + " added, " + updated + " updated" + (skipped ? ", " + skipped + " rows skipped" : ""));
      };
      reader.readAsText(t.files[0]);
      return;
    }
    if (t.dataset.pref) { cur().prefs[t.dataset.pref] = t.checked; save(); return toast("Notification settings saved"); }
    if (t.id === "pf-photo" && t.files[0]) {
      const file = t.files[0];
      if (file.size > 5 * 1024 * 1024) { t.value = ""; return toast("Choose a photo under 5 MB"); }
      const r = new FileReader();
      r.onload = () => {
        // Shrink to 256px so the sample stays small; the real app resizes on the server.
        const img = new Image();
        img.onload = () => { const s = 256, c = document.createElement("canvas"), k = Math.max(s / img.width, s / img.height); c.width = c.height = s; c.getContext("2d").drawImage(img, (s - img.width * k) / 2, (s - img.height * k) / 2, img.width * k, img.height * k); pendingPhoto = c.toDataURL("image/jpeg", 0.85); const av = t.closest("form").querySelector(".avatar"); av.innerHTML = '<img src="' + pendingPhoto + '" alt="">'; };
        img.src = r.result;
      };
      r.readAsDataURL(file);
    }
  });

  document.addEventListener("submit", (ev) => {
    ev.preventDefault();
    const form = ev.target, data = Object.fromEntries(new FormData(form));
    switch (form.id) {
      case "loginForm": {
        const p = digits(data.phone);
        if (p.length !== 10) return toast("Enter a 10-digit mobile number");
        loginStep = { phone: p, sent: true }; return openOtp();
      }
      case "otpForm": {
        if (String(data.otp).trim() !== DEMO_CODE) { const e = $("#otpErr"); e.hidden = false; e.textContent = "That code is not right. Check WhatsApp and try again."; e.style.color = "var(--bad)"; return; }
        const u = S.users.find((x) => x.phone === loginStep.phone);
        if (u) { setSession(u.id); closeModal(); ui.view = "home"; render(); return toast("Welcome back, " + u.name.split(" ")[0]); }
        return openRegister(loginStep.phone);
      }
      case "profileForm": {
        const mode = form.dataset.mode;
        const fields = { name: data.name.trim(), batch: Number(data.batch), branch: data.branch, degree: data.degree, position: data.position.trim(), org: data.org.trim(), homeDistrict: data.homeDistrict, homeState: "Bihar", workDistrict: data.workDistrict.trim(), workState: data.workState, email: data.email.trim(), linkedin: data.linkedin.trim(), skills: data.skills.trim(), mentor: !!data.mentor, privacy: { phone: data.vphone, email: data.vemail }, updated: TODAY };
        if (mode === "register") {
          const phone = digits(data.phone);
          if (phone.length !== 10) return toast("Enter a 10-digit mobile number");
          if (S.users.some((u) => u.phone === phone)) return toast("This number is already registered. Sign in instead");
          if (S.users.some((u) => u.roll && u.roll.toLowerCase() === data.roll.trim().toLowerCase())) return toast("This roll number is already registered. Contact a chapter admin");
          const proof = $("#pf-proof").files[0];
          const u = P(Object.assign({ id: uid("a"), phone: phone, roll: data.roll.trim().toUpperCase(), status: "pending", proof: proof ? proof.name : "", applied: TODAY, vouch: data.vouch || "", photo: pendingPhoto }, fields));
          S.users.push(u);
          notify(u.id, "We received your registration. An admin will review it within 2 working days.", "profile");
          notify("staff", "New registration: " + u.name + " (" + u.batch + ", " + u.branch + ").", "admin");
          if (u.vouch) notify(u.vouch, u.name + " named you as someone who can confirm they are an alumnus.", "home");
          setSession(u.id); closeModal(); ui.view = "home"; save(); render(); return toast("Submitted for verification");
        }
        const c = cur();
        Object.assign(c, fields); if (pendingPhoto) c.photo = pendingPhoto; pendingPhoto = null;
        if (mode === "resubmit") { c.status = "pending"; c.applied = TODAY; delete c.rejectReason; delete c.rejectNote; notify("staff", c.name + " corrected their details and submitted again.", "admin"); }
        save(); render(); return toast(mode === "resubmit" ? "Submitted again for verification" : "Profile saved");
      }
      case "postForm": {
        const p = { id: uid("p"), type: data.type, title: data.title.trim(), org: data.org.trim(), district: data.district.trim(), state: data.state, body: data.body.trim(), link: data.link.trim(), by: S.session, date: TODAY, expires: addDays(TODAY, Number(data.days)), status: "open", interested: [] };
        S.posts.push(p);
        if (p.type === "job" || p.type === "referral") verifiedUsers().filter((u) => u.id !== S.session && u.workState === p.state && u.prefs.jobs).forEach((u) => notify(u.id, "New " + POST_TYPES[p.type].toLowerCase() + " in " + p.state + ": " + p.title, "board"));
        ui.boardType = "all"; ui.boardState = ""; save(); closeModal(); render(); return toast("Posted. It closes on " + fmtDate(p.expires));
      }
      case "eventForm": {
        if (data.end <= data.start) return toast("The end time must be after the start time");
        const e = { id: uid("e"), title: data.title.trim(), date: data.date, start: data.start, end: data.end, venue: data.venue.trim(), desc: data.desc.trim(), fee: Number(data.fee) || 0, feeBasis: data.feeBasis, capacity: Number(data.capacity), rsvps: [] };
        S.events.push(e); log("Created event “" + e.title + "”");
        if (data.notify) verifiedUsers().filter((u) => u.id !== S.session).forEach((u) => notify(u.id, "New event: " + e.title + " on " + fmtDate(e.date) + ".", "events"));
        save(); closeModal(); ui.view = "events"; render(); return toast("Event published");
      }
      case "annForm": {
        const n = { id: uid("n"), title: data.title.trim(), body: data.body.trim(), date: TODAY, pinned: !!data.pinned };
        S.announcements.push(n); log("Posted announcement “" + n.title + "”");
        if (data.notify) verifiedUsers().filter((u) => u.id !== S.session).forEach((u) => notify(u.id, "Announcement: " + n.title, "home"));
        save(); closeModal(); render(); return toast("Announcement published");
      }
      case "updForm": {
        const u = { id: uid("u"), tag: data.tag, title: data.title.trim(), date: data.date, url: data.url.trim() };
        S.updates.push(u); log("Added NIT Agartala update “" + u.title + "”"); save(); closeModal(); render(); return toast("Update added");
      }
      case "rsvpForm": {
        const e = S.events.find((x) => x.id === form.dataset.event), g = Number(data.guests);
        const mine = myRsvp(e), pay = data.pay || "venue";
        let r = mine;
        if (mine) { mine.guests = g; mine.pay = pay; } else { r = { uid: S.session, guests: g, pay: pay, paid: 0 }; e.rsvps.push(r); }
        save(); closeModal(); render();
        if (e.fee && pay === "online" && balance(e, r) > 0) return openPay(e.id);
        return toast(mine ? "RSVP updated" : "See you there. Added to " + e.title);
      }
      case "reportForm": {
        const p = S.posts.find((x) => x.id === form.dataset.post);
        S.reports.push({ id: uid("r"), post: p.id, by: S.session, reason: data.reason, date: TODAY, status: "open" });
        notify("staff", "A post was reported: “" + p.title + "”.", "admin");
        save(); closeModal(); render(); return toast("Report sent to moderators");
      }
      case "rejectForm": {
        const a = byId(form.dataset.uid);
        a.status = "rejected"; a.rejectReason = data.reason; a.rejectNote = data.note.trim();
        notify(a.id, "Your registration was not verified: " + data.reason + ". Open your profile to correct it.", "profile");
        log("Rejected " + a.name + " (" + a.roll + "): " + data.reason);
        save(); closeModal(); render(); return toast("Registration rejected");
      }
      case "askForm": {
        const a = byId(form.dataset.uid);
        a.infoAsked = true; notify(a.id, "The committee needs more information: " + data.msg.trim(), "profile");
        log("Asked " + a.name + " for more information");
        save(); closeModal(); render(); return toast("Message sent to " + a.name);
      }
    }
  });

  document.getElementById("sideEmblem").innerHTML = emblem(false);
  render();
})();
</script>
</body></html>
